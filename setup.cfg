[metadata]
name = ocr-spelling-correction
version = 2.0.0
description = NLP-Based OCR with Automatic Spelling Correction
long_description = file: README.md
long_description_content_type = text/markdown
author = DARREN-2000
url = https://github.com/DARREN-2000/OCR-with-Handwritten-Recognition-and-Auto-Spelling-Correction
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Image Recognition
    Topic :: Text Processing :: Linguistic

[options]
packages = find:
python_requires = >=3.9
install_requires =
    Flask>=3.0
    Flask-RESTful>=0.3
    Werkzeug>=3.0
    gunicorn>=20.0
    numpy>=1.21
    opencv-python>=4.5
    Pillow>=10.0
    pytesseract>=0.3
    nltk>=3.8
    langdetect>=1.0
    language-tool-python>=2.7

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0
    flake8>=6.0

[tool:pytest]
testpaths = tests
addopts = -v --tb=short

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,build,dist
